spring.application.name=JavaSpringUsers
server.port=8081

# H2 in-memory
spring.datasource.url=jdbc:h2:mem:users_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true

# Configuration JWT (Itération 5)
# Surchargée en production via les variables d'environnement JWT_SECRET et JWT_EXPIRATION
jwt.secret=${JWT_SECRET:MaSuperCleSecreteDe256BitsPourSignerMesTokensEnTouteSecurite!}
jwt.expiration=${JWT_EXPIRATION:86400000}


